/* Layout: one full-screen pixel scene (night blue lit orange by a campfire). Pixel buttons along the top open framed panels over it. */
:root{
  --night:#070b24; --blue:#1d2a66; --blue2:#2c3f8f; --ice:#9fd0ff;
  --fire:#ff8a2a; --fire2:#ffd25a; --ember:#e8461f; --ink:#1a0b06; --paper:#f4e6c8;
  --pixel:"Press Start 2P", ui-monospace, monospace; --body:"VT323", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night)}
body{color:var(--paper);font-family:var(--body);font-size:22px;line-height:1.25}
canvas#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.bar{position:fixed;left:0;right:0;top:0;z-index:3;display:flex;justify-content:center;flex-wrap:wrap;gap:10px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.pbtn{font-family:var(--pixel);font-size:11px;letter-spacing:.04em;color:#fff;background:var(--blue2);border:0;padding:10px 12px 9px;cursor:pointer;position:relative;
  box-shadow:inset -3px -3px 0 #16205a,inset 3px 3px 0 #5d79d6,0 0 0 3px var(--ink),0 6px 0 3px var(--ink);text-shadow:2px 2px 0 #0b1238;transition:transform .05s}
.pbtn:hover{background:#3a54b8}
.pbtn:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 #16205a,inset 3px 3px 0 #5d79d6,0 0 0 3px var(--ink),0 3px 0 3px var(--ink)}
.pbtn.hot{background:var(--fire);box-shadow:inset -3px -3px 0 #b8501a,inset 3px 3px 0 #ffc07a,0 0 0 3px var(--ink),0 6px 0 3px var(--ink);text-shadow:2px 2px 0 #7a2a0a}
.pbtn.hot:hover{background:#ff9d48}
.pbtn:focus-visible{outline:3px solid var(--fire2);outline-offset:5px}
.tag{position:fixed;left:0;right:0;z-index:2;text-align:center;font-family:var(--pixel);font-size:clamp(9px,1.4vw,15px);color:var(--fire2);text-shadow:3px 3px 0 var(--ink);letter-spacing:.08em;padding:0 16px;display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;gap:16px}
.tag .cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tag .term{display:flex;align-items:center;gap:0;width:min(620px,100%);background:rgba(5,8,28,.82);box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px #26337a}
.tag .term code{font-family:var(--body);font-size:clamp(15px,1.6vw,20px);color:#e9ecff;padding:6px 12px;text-shadow:none;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-align:left}
.tag .term code::before{content:"$ ";color:var(--fire)}
.tag .term button{font-family:var(--pixel);font-size:9px;border:0;background:var(--fire);color:var(--ink);padding:10px 10px;cursor:pointer;align-self:stretch}
.tag .term button:focus-visible{outline:3px solid var(--fire2)}
.hint{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:2;text-align:center;font-family:var(--pixel);font-size:10px;color:#fff;text-shadow:2px 2px 0 var(--ink);animation:blink 1.2s steps(1) infinite;pointer-events:none}
@keyframes blink{50%{opacity:0}}

.veil{position:fixed;inset:0;z-index:5;background:rgba(5,8,28,.55);display:grid;place-items:center;
  padding:calc(70px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel{width:min(860px,100%);max-height:100%;overflow:auto;background:#101741;color:var(--paper);position:relative;
  box-shadow:0 0 0 4px var(--ink),0 0 0 8px var(--fire),0 0 0 12px var(--ink),0 18px 0 8px rgba(0,0,0,.45);padding:26px clamp(18px,4vw,36px) 28px}
.panel h2{font-family:var(--pixel);font-weight:400;font-size:clamp(15px,2.4vw,22px);line-height:1.4;color:var(--fire2);margin:0 0 14px;text-shadow:3px 3px 0 var(--ink);padding-right:44px}
.panel .lede{font-size:25px;margin:0 0 20px;color:#fff;max-width:56ch}
.panel p{margin:0 0 12px}
.x{position:absolute;top:14px;right:14px;font-family:var(--pixel);font-size:12px;width:34px;height:34px;padding:0;background:var(--ember);color:#fff;border:0;cursor:pointer;box-shadow:inset -3px -3px 0 #8a2410,inset 3px 3px 0 #ff8a6a,0 0 0 3px var(--ink)}
.x:focus-visible{outline:3px solid var(--fire2);outline-offset:3px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.cell{background:#18225a;padding:14px 16px;box-shadow:inset 0 0 0 3px #26337a}
.cell b{display:block;font-family:var(--pixel);font-weight:400;font-size:11px;line-height:1.5;color:var(--ice);margin-bottom:8px}
.cell p{margin:0;color:#d9dcf2}
.cell.warm{box-shadow:inset 0 0 0 3px #7a3a1a;background:#2a1a2a}
.cell.warm b{color:var(--fire2)}
code,.cmd{font-family:var(--body);color:var(--fire2)}
.cmd{display:block;background:#05081c;padding:12px 14px;margin:10px 0 0;white-space:pre-wrap;font-size:21px;color:#e9ecff;box-shadow:inset 0 0 0 3px #26337a;overflow-x:auto}
.cmd .c{color:#7d86c8}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{all:unset;cursor:pointer;background:#18225a;padding:10px 12px;box-shadow:inset 0 0 0 3px #26337a;display:grid;gap:2px}
.slot b{font-family:var(--pixel);font-weight:400;font-size:10px;color:#fff}
.slot span{font-size:18px;color:#7ee08a}
.slot.off span{color:#7d86c8}
.slot[aria-pressed="true"],.slot:hover{box-shadow:inset 0 0 0 3px var(--fire)}
.slot:focus-visible{outline:3px solid var(--fire2);outline-offset:2px}
.desc{margin-top:14px;min-height:3.8em;padding:12px 14px;background:#05081c;box-shadow:inset 0 0 0 3px #26337a}
.desc b{font-family:var(--pixel);font-weight:400;font-size:10px;color:var(--fire2)}
.meter{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;align-items:center;margin:14px 0}
.meter span{font-family:var(--pixel);font-size:9px;color:var(--ice)}
.meter i{display:block;height:14px;background:repeating-linear-gradient(90deg,var(--c) 0 8px,transparent 8px 10px);box-shadow:0 0 0 2px var(--ink)}
.keys{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 22px}
.keys div{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:2px dotted #26337a;flex-wrap:wrap}
.keys kbd{font-family:var(--pixel);font-size:9px;color:#fff;background:#26337a;padding:6px 7px 5px;box-shadow:inset -2px -2px 0 #16205a,0 3px 0 var(--ink)}
.keys span{margin-left:8px;color:#d9dcf2}
@media (max-width:640px){.keys{grid-template-columns:1fr}}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.links a{font-family:var(--pixel);font-size:10px;color:var(--fire2);text-decoration:none;padding:8px 10px;box-shadow:inset 0 0 0 3px #7a3a1a}
.links a:hover{background:#2a1a2a}
@media (max-width:640px){.grid{grid-template-columns:1fr}.pbtn{font-size:9px;padding:8px 9px 7px}.bar{gap:8px}}
@media (prefers-reduced-motion:reduce){.hint{animation:none}}
</style>

<canvas id="scene" role="img" aria-label="Pixel art: a man in a red beanie and blue hoodie sits on a log by a campfire at night with a glowing laptop; the giant word HEARTH glows orange above him."></canvas>

<nav class="bar" aria-label="Hearth">

</nav>
<div class="tag" id="tag"><div>A PRIVATE LINUX FOR ENGINEERS</div>
  <div class="cta"><button class="pbtn hot" type="button" data-p="get">GET HEARTH</button><button class="pbtn" type="button" data-p="keys">KEYBINDS</button></div>
  <div class="term"><code id="one">sudo git clone https://github.com/bnvac/nixosconfig /etc/nixos</code><button type="button" id="copy" aria-label="Copy install command">COPY</button></div></div>


<div class="veil" id="veil" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="ph" tabindex="-1" id="panel">
    <button class="x" type="button" id="close" aria-label="Close">X</button>
    <div id="pbody"></div>
  </div>
</div>

<template id="t-ai">
  <h2 id="ph">AI THAT STAYS HOME</h2>
  <p class="lede">Your assistant runs on your own graphics card, on open models you choose. Nothing you say leaves the machine, there's no subscription, and it works with the internet unplugged.</p>
  <div class="grid">
    <div class="cell warm"><b>RUNS ON AMD CARDS</b><p>Models run on Vulkan through the stock Mesa driver, so mid-range AMD cards like the RX 6750 XT get full GPU speed with nothing extra to install.</p></div>
    <div class="cell"><b>OPEN MODELS, ONE MENU</b><p>Pick any model from <code>modtui</code> with a download bar; the list only offers ones that fit your card. Default is Qwen 3.5 9B with thinking off for quick replies.</p></div>
    <div class="cell"><b>A VOICE, LOCALLY</b><p>Neb listens with whisper.cpp and speaks with Piper, both on-device. Press Super+Alt+N and talk; he answers in a corner of the screen.</p></div>
    <div class="cell"><b>IT ASKS FIRST</b><p>Neb can act on the desktop, but typing, pressing keys and closing windows wait for a yes. Open-WebUI gives a full chat page on localhost.</p></div>
  </div>
  <div class="cmd"><span class="c"># the whole stack, one line in settings</span>
mod on assistant</div>
</template>

<template id="t-battery">
  <h2 id="ph">LONGER ON BATTERY</h2>
  <p class="lede">The laptop runs flat out on the charger and switches itself into a frugal mode the moment you unplug. No toggles to remember.</p>
  <div class="meter" aria-hidden="true">
    <span>ON CHARGER</span><i style="--c:#ff8a2a;width:100%"></i>
    <span>ON BATTERY</span><i style="--c:#7ee08a;width:55%"></i>
  </div>
  <div class="grid">
    <div class="cell"><b>CPU THAT KNOWS</b><p>Power-saving governor, "power" energy policy and the low-power platform profile on battery; performance on AC. Handled by TLP, with thermald keeping heat down.</p></div>
    <div class="cell"><b>IDLE USB SLEEPS</b><p>Unused USB devices autosuspend, except the keyboard and mouse receiver, so nothing lags when you reach for it.</p></div>
    <div class="cell"><b>LESS RUNNING</b><p>Background work is automatically deprioritised, no documentation is built, the journal is capped and old system generations are cleared after 14 days.</p></div>
    <div class="cell warm"><b>SEE WHAT DRAWS POWER</b><p>Charge-limit thresholds depend on vendor support, so they aren't guessed at. <code>tlp-stat -b</code> says whether your laptop allows them, and <code>powertop</code> shows what's drawing power.</p></div>
  </div>
</template>

<template id="t-eng">
  <h2 id="ph">BUILT FOR THE BENCH</h2>
  <p class="lede">The tools for circuits, printers and code are installed, configured and aware of each other, so an evening of building starts with building.</p>
  <div class="grid">
    <div class="cell warm"><b>DESIGN → BOM → SHELF</b><p>KiCad and FreeCAD, plus Backoffice, my workshop inventory: import the BOM and it tells you what's already in your drawers.</p></div>
    <div class="cell"><b>PRINTERS ON THE LAN</b><p>OrcaSlicer with real Elegoo profiles. Klipper printers are found on the network and a desktop notification arrives when a print finishes or fails.</p></div>
    <div class="cell"><b>ANY REPO, KEPT CURRENT</b><p>Name a git repo and a type (Rust, Go, Node, Python, make, Docker) and it's built and moved to its newest commit, but only one that builds.</p></div>
    <div class="cell"><b>TWO MACHINES, ONE SELF</b><p>Syncthing for files, your open tabs sent to the other machine in one command, bookmarks merged at login. Docker, Distrobox, QEMU and Claude Code are a module away.</p></div>
    <div class="cell"><b>NO INTERNET NEEDED</b><p>At login you join intraweb, my local neighborhood web: pages, signed mail and files with anyone on the same Wi-Fi, no server.</p></div>
    <div class="cell"><b>A MENU FOR EVERYTHING</b><p>Super+Alt+Space opens every action on the system by category. Your keybinds live under Super+Alt so defaults stay put.</p></div>
  </div>
</template>

<template id="t-privacy">
  <h2 id="ph">YOUR MACHINE, YOUR BUSINESS</h2>
  <p class="lede">Private by default, without breaking the things you use every day.</p>
  <div class="grid">
    <div class="cell warm"><b>TOR MODE</b><p><code>tormode on</code> sends everything through Tor and waits until it's connected. IPv6, QUIC, the LAN, Docker and VPNs can't go through Tor, so they're refused instantly instead of leaking or hanging.</p></div>
    <div class="cell"><b>THE LOCKED DOOR</b><p>Firewall on, SSH off, sudo needs a password, kernel hardening light enough that Steam and VMs still work. Drives never mount by themselves.</p></div>
    <div class="cell"><b>SEALED SECRETS</b><p>Passwords and keys stay encrypted in the repo with sops-nix and unlock with a key that never leaves the machine.</p></div>
    <div class="cell"><b>YOUR OWN VAULT</b><p>Daily restic snapshots to your own drive. Browser passwords go into Bitwarden and the exported file is shredded.</p></div>
  </div>
</template>

<template id="t-mods">
  <h2 id="ph">SEVENTEEN MODULES</h2>
  <p class="lede">Every feature is one module. Switch one on with a command; switch it off and it stays written, just unbuilt, ready to come back.</p>
  <div class="inv" id="inv"></div>
  <div class="desc" id="desc" aria-live="polite"></div>
</template>

<template id="t-keys">
  <h2 id="ph">THE KEYBOARD</h2>
  <p class="lede">The defaults stay where you expect. Everything Hearth adds lives under Super+Alt, and <code>mykeys</code> shows this list on screen.</p>
  <div class="keys">
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>Space</kbd><span>Every action on the system</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>N</kbd><span>Talk to Neb</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>A</kbd><span>All apps by category</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>V</kbd><span>Audio device and volume</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>M</kbd><span>Mount and unlock drives</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>D</kbd><span>Your self-hosted apps</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>E</kbd><span>File manager</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>L</kbd><span>Lock the screen</span></div>
    <div><kbd>Super</kbd><kbd>Alt</kbd><kbd>F1</kbd><span>This cheat sheet</span></div>
    <div><kbd>Super</kbd><kbd>Enter</kbd><span>Terminal</span></div>
  </div>
</template>

<template id="t-get">
  <h2 id="ph">LIGHT THE FIRE</h2>
  <p class="lede">Start from any NixOS install. Keep its hardware file, take everything else from Hearth.</p>
  <div class="cmd"><span class="c"># keep your hardware config</span>
sudo nixos-generate-config
sudo mv /etc/nixos /etc/nixos.orig
sudo git clone https://github.com/bnvac/nixosconfig /etc/nixos
sudo cp /etc/nixos.orig/hardware-configuration.nix /etc/nixos/
sudo nixos-rebuild switch
<span class="c"># then pick desktop or laptop, modules and a model</span>
modtui</div>
  <p style="margin-top:16px">Updates are <code>nixup</code>. To make it yours, fork the repo and clone the fork; everything follows it.</p>
  <div class="links"><a href="https://github.com/bnvac/nixosconfig" target="_blank" rel="noopener">SOURCE ↗</a></div>
</template>
